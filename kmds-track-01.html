<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMDS Delivery – Track your parcel</title>
<meta name="description" content="KMDS last-mile delivery across Cameroon. Enter your tracking number to see where your parcel is.">
<meta property="og:title" content="KMDS Delivery – Track your parcel"><meta property="og:description" content="KMDS last-mile delivery across Cameroon. Enter your tracking number to see where your parcel is."><meta property="og:site_name" content="KMDS Cameroon"><meta property="og:type" content="website">
<style>
:root{--g:#b8932f;--gd:#8a6414;--ink:#16130c;--m:#7a7464;--l:#e8e2d0;--bg:#f6f3ea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.top{background:#0b0a08;color:#fff;padding:18px 20px;text-align:center}.top b{font-family:Georgia,serif;font-size:24px;letter-spacing:2px;color:#d9b650}.top small{display:block;color:#b9b19a;letter-spacing:2px;font-size:11px;margin-top:4px;text-transform:uppercase}
.w{max-width:480px;margin:0 auto;padding:22px 16px 40px}
.c{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;box-shadow:0 6px 24px rgba(40,30,0,.07)}
h1{font-family:Georgia,serif;font-size:26px;margin:0 0 6px}p{color:var(--m);margin:0 0 14px;line-height:1.45}
input{width:100%;font:inherit;font-size:17px;padding:14px;border:1px solid #d9d2bd;border-radius:12px;background:#fff;text-transform:uppercase}
button{width:100%;margin-top:12px;font:inherit;font-weight:700;font-size:16px;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,#e0bd58,#b8932f);color:#16130c;cursor:pointer}
.st{display:flex;gap:12px;padding:9px 0;align-items:flex-start}.dot{flex:none;width:24px;height:24px;border-radius:50%;background:#e6e0cf;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}.on .dot{background:var(--gd)}.st b{display:block}.st small{color:var(--m)}.off{color:#9a9482}
.rt{background:#fbf6e6;border:1px solid #ecdcaa;border-radius:12px;padding:12px 14px;margin:14px 0;font-weight:600}
.note{background:#fbf6e6;border-left:3px solid var(--g);border-radius:8px;padding:12px 14px;color:#4a4636;font-size:14px;margin-top:14px}
.dbg{font-size:11px;color:#aaa;margin-top:10px;word-break:break-all}
a{color:var(--gd);font-weight:600}
</style></head><body>
<div class="top"><b>KMDS</b><small>Kingmakers Delivery Service</small></div>
<div class="w"><div class="c">
<h1>Track your parcel</h1><p>Enter the tracking number KMDS gave you. It looks like KMDS-BK-261112-AB12C.</p>
<form id="f"><input id="r" placeholder="KMDS-BK-..." autocomplete="off" autocapitalize="characters"><button id="b" type="submit">Track parcel</button></form>
<div id="o"></div>
<div class="note">Only the parcel status is shown here. Names, phone numbers and payment details are never shown publicly. Need help? <a id="wa" target="_blank" rel="noopener" href="https://wa.me/237641560868">Chat with us on WhatsApp</a>.</div>
</div></div>
<script>
(function(){
var SB="https://qfocanqogkugdyzatjty.supabase.co",KEY="sb_publishable_U2YFEQTrTTHTaJ9wRpaPjA_8QROpqeW";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function tm(v){if(!v)return"";var x=new Date(v);return x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})+", "+x.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
var S=[["new","Received"],["in_transit","In transit"],["arrived","Arrived at agency"],["delivered","Delivered"]];
async function go(ref){ref=(ref||"").trim().toUpperCase();var o=$("o"),b=$("b");
 if(ref.length<8){o.innerHTML='<div class="note">Please enter your full tracking number.</div>';return}
 b.disabled=true;b.textContent="Searching...";o.innerHTML="";
 try{var r=await fetch(SB+"/rest/v1/rpc/track_delivery",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_ref:ref})});
  var t=await r.text();b.disabled=false;b.textContent="Track parcel";
  if(!r.ok){o.innerHTML='<div class="note">Tracking is not available right now. Please message us on WhatsApp with your tracking number.</div><div class="dbg">Code '+r.status+': '+esc(t.slice(0,200))+'</div>';return}
  var d=null;try{d=JSON.parse(t)}catch(e){}
  if(!d||!d.status){o.innerHTML='<div class="note">We could not find that tracking number. Check it and try again, or message us on WhatsApp.</div>';return}
  if(d.status==="cancelled"){o.innerHTML='<div class="note"><b>'+esc(ref)+'</b><br>This delivery was cancelled. Please message us on WhatsApp.</div>';return}
  var cur=-1,at={};S.forEach(function(x,k){if(x[0]===d.status)cur=k});(d.events||[]).forEach(function(e){at[e.status]=e.at});
  o.innerHTML='<div class="rt">'+esc(ref)+'<br><span style="font-weight:400;color:#7a7464">'+esc(d.from_city||"")+' &rarr; '+esc(d.to_city||"")+'</span></div>'+S.map(function(x,k){var on=k<=cur;return'<div class="st '+(on?"on":"off")+'"><span class="dot">'+(on?"&#10003;":"")+'</span><div><b>'+x[1]+'</b>'+(at[x[0]]?'<small>'+tm(at[x[0]])+'</small>':'')+'</div></div>'}).join("");
 }catch(e){b.disabled=false;b.textContent="Track parcel";o.innerHTML='<div class="note">No internet connection. Please try again.</div>'}}
$("f").onsubmit=function(e){e.preventDefault();go($("r").value)};
var q=(location.search.match(/[?&]ref=([^&]+)/)||location.hash.match(/ref=([^&]+)/)||[])[1];if(q){q=decodeURIComponent(q);$("r").value=q;go(q)}
})();
</script></body></html>
