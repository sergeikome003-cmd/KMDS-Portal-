<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KMDS Seller Submission</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0b0b0b;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding:16px}
.box{max-width:560px;margin:0 auto}h1{font-family:Georgia,serif;font-weight:400;color:#e6c56a;font-size:24px;margin:6px 0 4px}
.card{background:#151515;border:1px solid #2c2c2c;border-radius:12px;padding:16px;margin-top:14px}
label{display:block;margin:12px 0 4px;font-size:14px;color:#cfcfcf}input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #cfc8b4;background:#fff;color:#111;font-size:16px}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:8px;background:linear-gradient(180deg,#e6c56a,#b8902f);color:#1a1305;font-weight:700;font-size:16px;cursor:pointer}.btn:disabled{opacity:.6}
.note{background:#1d1a10;border:1px solid #4a3d15;color:#e8dcb0;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:12px}.err{color:#ff8a80;margin-top:10px;font-size:14px;min-height:18px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px}.small{font-size:12.5px;color:#9b9b9b}
</style></head><body><div class="box"><div class="small">KMDS Marketplace · private seller page</div><h1>Submit a product</h1><div id="app"><div class="card">Loading…</div></div></div>
<script>
var SB="https://qfocanqogkugdyzatjty.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmb2NhbnFvZ2t1Z2R5emF0anR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNTA5NDQsImV4cCI6MjA5ODgyNjk0NH0.HqcGfD7x8oeBeoJuMgZasWGsEKHEbm9s-4V2v9bSfVU";
var T=(location.hash.match(/t=([A-Za-z0-9]+)/)||[])[1]||"",$=function(i){return document.getElementById(i)};
function H(p,o){o=o||{};o.headers=Object.assign({apikey:KEY,Authorization:"Bearer "+KEY},o.headers||{});return fetch(SB+p,o)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var files=[];
function off(msg){$("app").innerHTML='<div class="card"><b>This link is not active.</b><p style="margin-top:8px;color:#cfcfcf">'+esc(msg||"Please contact KMDS on WhatsApp to get your link.")+'</p></div>'}
function shrink(f,max){return new Promise(function(res){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);res(b||f)},"image/jpeg",.85)};im.onerror=function(){res(f)};im.src=u})}
function form(name){$("app").innerHTML='<div class="card"><div class="small">Shop</div><div style="font-size:18px;color:#e6c56a"><b>'+esc(name)+'</b></div>'+
'<div class="note">Your product is sent to KMDS for review. It does NOT go live until KMDS approves it. KMDS may change the price, ask you questions, or reject products that do not meet our standards. Use only real photos of products you really have. KMDS never asks for money, PIN or codes.</div>'+
'<label>Your registered phone number (the one KMDS saved for your shop)</label><input id="ph" type="tel" inputmode="tel" placeholder="6XX XXX XXX">'+
'<label>Product name</label><input id="ti" maxlength="120"><label>Price (FCFA)</label><input id="pr" type="number" inputmode="numeric" min="1"><label>Quantity available</label><input id="qt" type="number" inputmode="numeric" min="1" value="1"><label>Description (size, colour, material…)</label><textarea id="de" rows="3" maxlength="1500"></textarea>'+
'<label>Photos (1 to 5 real photos)</label><input id="fi" type="file" accept="image/*" multiple><div class="ph" id="pv"></div>'+
'<div class="note">KMDS commission is 10% of each sale, with a minimum of 50 FCFA. KMDS handles customer payment and delivery.</div><button class="btn" id="go">Send to KMDS</button><div class="err" id="er"></div></div>';
$("fi").onchange=function(){files=[].slice.call($("fi").files,0,5);$("pv").innerHTML="";files.forEach(function(f){var i=document.createElement("img");i.src=URL.createObjectURL(f);$("pv").appendChild(i)})};
$("go").onclick=send}
async function send(){var er=$("er");er.textContent="";var ph=$("ph").value.trim(),ti=$("ti").value.trim(),pr=Math.round(Number($("pr").value)),qt=Math.round(Number($("qt").value)),de=$("de").value.trim();
 if(ph.replace(/\D/g,"").length<9)return er.textContent="Enter your registered phone number.";if(ti.length<2)return er.textContent="Enter the product name.";if(!(pr>0))return er.textContent="Enter the price.";if(!(qt>0))return er.textContent="Enter the quantity.";if(!files.length)return er.textContent="Add at least one photo.";
 var b=$("go");b.disabled=true;b.textContent="Sending…";
 try{var paths=[];for(var i=0;i<files.length;i++){var blob=await shrink(files[i],1100),p=T+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
   var u=await H("/storage/v1/object/mk-submit/"+p,{method:"POST",headers:{"Content-Type":"image/jpeg"},body:blob});if(!u.ok)throw new Error("PHOTO");paths.push(p)}
  var r=await H("/rest/v1/rpc/mk_submit_product",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({p_token:T,p_phone:ph,p_title:ti,p_price:pr,p_qty:qt,p_desc:de,p_images:paths})});
  var j=await r.json().catch(function(){return null});
  if(!r.ok){var m=JSON.stringify(j||"");throw new Error(m.indexOf("PHONE_MISMATCH")>-1?"PHONE":m.indexOf("LINK_OFF")>-1?"OFF":m.indexOf("TOO_MANY_PENDING")>-1?"MANY":"FAIL")}
  $("app").innerHTML='<div class="card"><h1 style="font-size:22px">Received. Thank you.</h1><p style="margin-top:8px">Your reference is <b style="color:#e6c56a">'+esc(j)+'</b>.</p><p style="margin-top:8px;color:#cfcfcf">KMDS will review your product. It appears on the marketplace only after approval. We will contact you on WhatsApp.</p><button class="btn" onclick="location.reload()">Submit another product</button></div>'
 }catch(e){b.disabled=false;b.textContent="Send to KMDS";var c=String(e.message);er.textContent=c==="PHONE"?"That phone number does not match your shop record. Please use the number KMDS registered.":c==="OFF"?"This link is not active. Contact KMDS.":c==="MANY"?"You have many products waiting for review. Please wait for KMDS to review them first.":"Could not send. Check your internet and try again."}}
if(!T){off("The link is incomplete. Please use the full link KMDS sent you.")}else{H("/rest/v1/rpc/mk_submit_info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({p_token:T})}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.shop_name)form(j.shop_name);else off()}).catch(function(){off("Could not connect. Please try again.")})}
</script></body></html>
